    SiteVisitBlock:
      type: object
      properties:
        planned_visits:
          type: integer
        recorded_visits:
          type: integer
        completed_visits:
          type: integer
        cancelled_visits:
          type: integer
        open_visits:
          type: integer
      required:
      - cancelled_visits
      - completed_visits
      - open_visits
      - planned_visits
      - recorded_visits
    SiteVisitCheckIn:
      type: object
      description: Opens a visit.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy:
          type: number
          format: double
          nullable: true
        address:
          type: string
          default: ''
          maxLength: 255
        captured_at:
          type: string
          format: date-time
        site:
          type: string
          format: uuid
        purpose:
          allOf:
          - $ref: '#/components/schemas/SiteVisitCheckInPurposeEnum'
          default: follow_up
        remarks:
          type: string
          default: ''
          maxLength: 2000
        sync_id:
          type: string
          format: uuid
      required:
      - latitude
      - longitude
      - site
    SiteVisitCheckInPurposeEnum:
      enum:
      - new_lead
      - follow_up
      - order_collection
      - payment_collection
      - technical_support
      - complaint
      type: string
      description: |-
        * `new_lead` - new_lead
        * `follow_up` - follow_up
        * `order_collection` - order_collection
        * `payment_collection` - payment_collection
        * `technical_support` - technical_support
        * `complaint` - complaint
    SiteVisitCheckOut:
      type: object
      description: Closes a visit, and carries what the visit found.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy:
          type: number
          format: double
          nullable: true
        address:
          type: string
          default: ''
          maxLength: 255
        captured_at:
          type: string
          format: date-time
        stage_observed:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/SiteVisitCheckOutStageObservedEnum'
          - $ref: '#/components/schemas/BlankEnum'
        competitor_brands:
          type: array
          items:
            type: string
            maxLength: 80
        expected_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        follow_up_date:
          type: string
          format: date
          nullable: true
        remarks:
          type: string
          default: ''
          maxLength: 2000
        sync_id:
          type: string
          format: uuid
      required:
      - latitude
      - longitude
    SiteVisitCheckOutStageObservedEnum:
      enum:
      - foundation
      - structure
      - brickwork
      - plaster
      - finishing
      - completed
      type: string
      description: |-
        * `foundation` - foundation
        * `structure` - structure
        * `brickwork` - brickwork
        * `plaster` - plaster
        * `finishing` - finishing
        * `completed` - completed
    SiteVisitImage:
      type: object
      description: |-
        One photo. `path` is the key the client reads — on the device it was a
        local file path, and over the wire it is the URL that replaced it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        path:
          type: string
          readOnly: true
        tag:
          allOf:
          - $ref: '#/components/schemas/SiteVisitImageTagEnum'
          readOnly: true
        caption:
          type: string
          readOnly: true
        location:
          type: object
          additionalProperties: {}
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - caption
      - captured_at
      - id
      - location
      - path
      - tag
    SiteVisitImageTagEnum:
      enum:
      - site_front
      - work_in_progress
      - material_stack
      - competitor_product
      - other
      type: string
      description: |-
        * `site_front` - Site front
        * `work_in_progress` - Work in progress
        * `material_stack` - Material stack
        * `competitor_product` - Competitor product
        * `other` - Other
    SiteVisitPurposeEnum:
      enum:
      - new_lead
      - follow_up
      - order_collection
      - payment_collection
      - technical_support
      - complaint
      type: string
      description: |-
        * `new_lead` - New lead
        * `follow_up` - Follow-up
        * `order_collection` - Order collection
        * `payment_collection` - Payment collection
        * `technical_support` - Technical support
        * `complaint` - Complaint
    SiteVisitReport:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        planned:
          type: integer
        recorded:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        open:
          type: integer
        average_visit_minutes:
          type: number
          format: double
          nullable: true
      required:
      - average_visit_minutes
      - cancelled
      - completed
      - date_from
      - date_to
      - open
      - planned
      - recorded
    SiteVisitStatusEnum:
      enum:
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `in_progress` - In progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    SkipVisit:
      type: object
      description: A skip has to say why — an unexplained gap in coverage is useless.
      properties:
        reason:
          type: string
          maxLength: 255
      required:
      - reason
    SourceEnum:
      enum:
      - mobile
      - web
      - admin
      type: string
      description: |-
        * `mobile` - Mobile app
        * `web` - Web
        * `admin` - Entered by an administrator
    StageEnum:
      enum:
      - foundation
      - structure
      - brickwork
      - plaster
      - finishing
      - completed
      type: string
      description: |-
        * `foundation` - Foundation
        * `structure` - Structure
        * `brickwork` - Brickwork
        * `plaster` - Plastering
        * `finishing` - Finishing
        * `completed` - Completed
    StageObserved098Enum:
      enum:
      - foundation
      - structure
      - brickwork
      - plaster
      - finishing
      - completed
      type: string
      description: |-
        * `foundation` - Foundation
        * `structure` - Structure
        * `brickwork` - Brickwork
        * `plaster` - Plastering
        * `finishing` - Finishing
        * `completed` - Completed
    StatusD9cEnum:
      enum:
      - active
      - invited
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `invited` - Invited
        * `suspended` - Suspended
    SyncDownloadQuery:
      type: object
      description: The download's query string.
      properties:
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        entities:
          type: string
        limit:
          type: integer
          maximum: 500
          minimum: 1
        device_id:
          type: string
          maxLength: 128
    SyncRecord:
      type: object
      description: One offline record, as the device queued it.
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        local_id:
          type: string
          maxLength: 128
        server_id:
          type: string
          nullable: true
          maxLength: 64
        operation:
          $ref: '#/components/schemas/OperationEnum'
        payload:
          type: object
          additionalProperties: {}
        device_timestamp:
          type: string
          format: date-time
          nullable: true
        sync_version:
          type: string
          format: date-time
          nullable: true
      required:
      - entity_type
      - local_id
      - operation
    SyncUpload:
      type: object
      description: A batch of records from one device.
      properties:
        idempotency_key:
          type: string
          maxLength: 64
        device_id:
          type: string
          maxLength: 128
        app_version:
          type: string
          maxLength: 32
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecord'
      required:
      - records
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TopCustomer:
      type: object
      properties:
        customer_id:
          type: string
        name:
          type: string
        code:
          type: string
        order_count:
          type: integer
        total:
          type: number
          format: double
      required:
      - code
      - customer_id
      - name
      - order_count
      - total
    TopProduct:
      type: object
      properties:
        product_id:
          type: string
        name:
          type: string
        code:
          type: string
        quantity:
          type: integer
        total:
          type: number
          format: double
      required:
      - code
      - name
      - product_id
      - quantity
      - total
    TypeEnum:
      enum:
      - dealer
      - distributor
      - retailer
      - contractor
      - architect
      type: string
      description: |-
        * `dealer` - Dealer
        * `distributor` - Distributor
        * `retailer` - Retailer
        * `contractor` - Contractor
        * `architect` - Architect
    UnitEnum:
      enum:
      - bag
      - kg
      - tonne
      - litre
      - piece
      - box
      - sqft
      type: string
      description: |-
        * `bag` - per bag
        * `kg` - per kg
        * `tonne` - per tonne
        * `litre` - per litre
        * `piece` - per piece
        * `box` - per box
        * `sqft` - per sq ft
    User:
      type: object
      description: |-
        The signed-in user.

        `name`, `phone`, `role` and `territory` are the keys the Flutter client's
        `UserModel.fromJson` already looks for. The canonical field names are sent
        *alongside* them rather than instead, so the app keeps working today while
        the payload stays honest about what the database actually stores.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee_code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        phone:
          type: string
          readOnly: true
          nullable: true
        mobile:
          type: string
          readOnly: true
          nullable: true
        role:
          type: string
          description: Role name, because the client renders it directly.
          readOnly: true
        role_id:
          type: string
          readOnly: true
        territory:
          type: string
          description: Primary posting. A user may cover several; the client shows
            one.
          readOnly: true
        department:
          type: string
          readOnly: true
        designation:
          type: string
          readOnly: true
        reporting_manager:
          type: string
          readOnly: true
        profile_photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD9cEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Unset automatically unless the status is Active.
        must_change_password:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date
          readOnly: true
        permissions:
          type: array
          items: {}
          description: |-
            Permission keys this user holds, e.g. `['place_orders', ...]`.

            Sent with the profile rather than baked into the access token, so a
            role change takes effect on the next request instead of waiting for
            the token to expire.
          readOnly: true
      required:
      - date_joined
      - department
      - designation
      - email
      - employee_code
      - full_name
      - id
      - is_active
      - mobile
      - must_change_password
      - name
      - permissions
      - phone
      - profile_photo
      - reporting_manager
      - role
      - role_id
      - status
      - territory
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: /
  description: This server
