        Three things: which product, how many, and what was knocked off. The rate
        and the tax are not on this list — they come from the catalogue.
      properties:
        product:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
