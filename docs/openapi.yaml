openapi: 3.0.3
info:
  title: Sales Force Management API
  version: 1.0.0
  description: |-
    Field sales backend: attendance, beat plans, site visits, customers, products, orders, reporting, offline sync and administration.

    All endpoints are versioned under `/api/v1/`. Everything except the public configuration endpoints (`/privacy/`, `/terms/`, `/app-version/`, `/app-config/`, `/announcements/`) requires a JWT bearer token from `/api/v1/auth/login/`.
paths:
  /api/v1/admin/announcements/:
    get:
      operationId: admin_announcements_list
      description: |-
        Every announcement, live or not.

        **Query** `is_active` · `priority`

        **Responses** `200` · `201` · `400` · `401` · `403`
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: admin_announcements_create
      description: |-
        Every announcement, live or not.

        **Query** `is_active` · `priority`

        **Responses** `200` · `201` · `400` · `401` · `403`
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
