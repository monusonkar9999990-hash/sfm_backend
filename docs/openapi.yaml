          type: integer
          readOnly: true
        unit_price:
          type: number
          format: double
          readOnly: true
        discount:
          type: number
          format: double
          readOnly: true
        gst_percent:
          type: number
          format: double
          readOnly: true
        gst_rate:
          type: number
          format: double
          readOnly: true
        gross:
          type: number
          format: double
          readOnly: true
        taxable:
          type: number
          format: double
          readOnly: true
        gst_amount:
          type: number
          format: double
          readOnly: true
        line_total:
          type: number
          format: double
          readOnly: true
