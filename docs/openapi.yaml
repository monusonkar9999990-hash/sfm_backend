          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SkipVisit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkipVisit'
          description: ''
  /api/v1/beats/plans/{id}/visits/{visit_pk}/visit/:
    post:
      operationId: beats_plans_visits_visit_create
      description: |-
        Record that a stop was called on.

