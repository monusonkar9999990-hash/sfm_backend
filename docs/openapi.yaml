    PatchedCustomerUpdate:
      type: object
      description: |-
        Correcting a customer already on the books.

        Every field is optional and only what was sent is written, so two people
        fixing different details of the same shop do not overwrite each other —
        and a record queued on a device with no signal carries the one field that
        changed rather than a whole stale copy of the customer.

        The uniqueness rules are the create serializer's, with one difference that
        matters: they exclude the customer being edited. Without that, saving a
        record without touching its phone number would fail because that number is
        already registered — to itself.
      properties:
        name:
          type: string
          maxLength: 150
        contact_person:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 16
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        type:
          $ref: '#/components/schemas/TypeEnum'
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          maxLength: 6
        gstin:
          type: string
          maxLength: 15
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
    PatchedEmployeeWrite:
      type: object
      description: |-
        Creating and editing an employee.

        `password` is optional on create. Left out, the account is created without
        a usable password and the person sets one from the invite — which is the
        flow this product is built around. An administrator typing a colleague's
        password into a form is not a flow worth supporting.
      properties:
        employee_code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9\-/]{1,19}$
          maxLength: 20
        full_name:
          type: string
          maxLength: 150
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        mobile:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+[1-9]\d{7,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/StatusD9cEnum'
        role:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
        designation:
          type: string
          format: uuid
          nullable: true
        reporting_manager:
          type: string
          format: uuid
          nullable: true
        password:
          writeOnly: true
          oneOf:
          - type: string
            minLength: 8
          - type: string
            maxLength: 0
        territories:
          type: array
          items:
            type: string
            format: uuid
        primary_territory:
          type: string
          format: uuid
          nullable: true
        is_staff:
          type: boolean
    PatchedLegalDocument:
      type: object
