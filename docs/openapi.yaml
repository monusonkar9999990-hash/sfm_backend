  /api/v1/beats/plans/{id}/complete/:
    post:
      operationId: beats_plans_complete_create
      description: |-
        Close the day's run.

        A plan with nothing visited closes as `missed`, not `completed` — that is
        the whole difference between a beat that was run badly and one that was
        never run. Any stop still pending is left pending; the plan is closed
        around it.

        **Responses**
        * `200` — the closed plan
        * `403` — not this user's plan, or the role lacks `plan_beats`
        * `404` — no such plan
        * `409` — the plan is already closed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - beats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteBeat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteBeat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteBeat'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteBeat'
          description: ''
  /api/v1/beats/plans/{id}/start/:
    post:
      operationId: beats_plans_start_create
      description: |-
        Start the day's run.

        Moves a `planned` plan to `in_progress` and stamps `started_at`. Starting
        an already-started plan returns it unchanged rather than failing, because
        a phone that retried cannot tell the difference.

        **Responses**
        * `200` — the plan, now in progress
        * `403` — not this user's plan, or the role lacks `plan_beats`
        * `404` — no such plan
        * `409` — the plan is already closed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - beats
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/beats/plans/{id}/visits/{visit_pk}/skip/:
    post:
      operationId: beats_plans_visits_skip_create
      description: |-
        Skip a stop, with a reason.

        A skipped stop never counts as covered — coverage would stop meaning
        anything if it did. The reason is required because an unexplained gap in a
        route is not information anyone can act on.

        **Responses**
        * `200` — the plan, with the stop now `skipped`
        * `400` — no reason given
        * `403` — not this user's plan, or the role lacks `plan_beats`
        * `404` — no such plan or stop
        * `409` — the plan is closed, or the stop was already resolved
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: visit_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - beats
      requestBody:
        content:
