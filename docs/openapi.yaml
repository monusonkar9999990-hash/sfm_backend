  /api/v1/admin/invite-requests/{id}/approve/:
    post:
      operationId: admin_invite_requests_approve_create
      description: |-
        Turns a request into an account.

        The new account is created without a usable password and flagged
        `must_change_password`, so the person sets their own from the invite. An
        administrator never types, sees or transmits somebody else's password.

        **Responses** `200` · `400` · `401` · `403` · `404` · `409`
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
