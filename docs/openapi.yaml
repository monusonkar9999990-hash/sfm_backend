      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - attendance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/v1/attendance/check-in/:
    post:
      operationId: attendance_check_in_create
      description: |-
        Start the working day.

        Send the GPS fix and a selfie as `multipart/form-data`. The punch is
        stamped with the nearest geofence and flagged if it falls outside it;
        whether that also refuses the punch is a server policy
        (`ATTENDANCE_ENFORCE_GEOFENCE`), not something the client decides.

        Pass `sync_id` — a UUID the device generates — so a retry after a dropped
        connection returns the original record instead of creating a second one.

        **Request** (`multipart/form-data`)
        `latitude`, `longitude`, `accuracy`, `address`, `captured_at`, `note`,
        `sync_id`, `selfie`

        **Responses**
        * `201` — the day's record
        * `200` — this `sync_id` was already recorded; the original is returned
        * `400` — bad GPS fix, missing selfie, stale punch, or outside the fence
        * `401` — missing or invalid access token
        * `403` — the role lacks `mark_attendance`
        * `409` — already checked in today
      tags:
      - attendance
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceCheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceCheckIn'
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckIn'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCheckIn'
          description: ''
  /api/v1/attendance/check-out/:
    post:
      operationId: attendance_check_out_create
      description: |-
        Close the working day.

        Applies to the open record. `worked_minutes` is computed on the server
        from the two stamps, so a device with a skewed clock cannot inflate its
        own hours.

        **Responses**
        * `200` — the closed record, or the same record again on a replay
        * `400` — bad GPS fix, missing selfie, or a punch-out before the punch-in
        * `401` — missing or invalid access token
        * `403` — the role lacks `mark_attendance`
        * `409` — no open check-in to close
      tags:
      - attendance
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceCheckOut'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceCheckOut'
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckOut'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCheckOut'
          description: ''
  /api/v1/attendance/today/:
    get:
      operationId: attendance_today_retrieve
      description: |-
        Today's record for the signed-in user, or `null` before the first punch.

        The client needs this to decide whether to offer a check-in or a check-out
        button when it launches.

        **Responses**
        * `200` — `{"attendance": {...}}` or `{"attendance": null}`
        * `401` — missing or invalid access token
      summary: Today's attendance record
      tags:
      - attendance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change the signed-in user's password.

        Every refresh token the user holds is blacklisted and a fresh pair is
        issued, so a password change signs every other device out — which is the
        point of changing it. The client should replace its stored tokens with the
        ones in the response.

        **Request**
        `{"current_password": "…", "new_password": "…", "confirm_password": "…"}`

        **Responses**
        * `200` — `{detail, access, refresh}`
        * `400` — wrong current password, mismatch, or the new password fails a validator
        * `401` — missing or invalid access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePassword'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Sign in with a mobile number, email address or employee code.

        Accepts any of the three as `identifier`; the authentication backend works
        out which one it is. Returns an access/refresh pair together with the full
        user profile, so the client needs one round trip rather than two.

        **Request**  `{"identifier": "9876543210", "password": "…"}`

        **Responses**
        * `200` — `{access, refresh, user, must_change_password}`
        * `400` — a field is missing
        * `401` — no active account matches those credentials
        * `429` — too many attempts (10 per minute per client)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Sign out by blacklisting the caller's refresh token.

        The access token is not revoked — it is stateless and short-lived and
        expires on its own. The refresh token is what keeps a session alive, so
        that is what gets killed.

        **Request**  `{"refresh": "…"}`

        **Responses**
        * `205` — signed out, the client should clear its stored tokens
        * `400` — the token is invalid, already blacklisted, or belongs to someone else
        * `401` — missing or invalid access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Return the signed-in user's profile.

        Includes the permission keys the client uses to hide or show features, so
        a revoked permission takes effect on the next call rather than when the
        access token expires.

        **Responses**
        * `200` — the user object
        * `401` — missing or invalid access token
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Exchange a refresh token for a new access token.

        Refresh rotation is on, so the response also carries a **new** refresh
        token and the one just used is blacklisted. Clients must store the new
        refresh token; replaying the old one fails.

        **Request**  `{"refresh": "…"}`

        **Responses**
        * `200` — `{access, refresh}`
        * `401` — the token is expired, malformed or already blacklisted
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/request-invite/:
    post:
      operationId: auth_request_invite_create
      description: |-
        Ask an administrator for an account.

        This product is invite-only: nobody signs themselves up. The endpoint
        records a request and grants nothing — no account, no token, no hint that
        the request went anywhere except into a queue.

        The reply is identical whether the request was recorded, the person
        already has an account, or they already have a request waiting. An
        endpoint open to the internet that distinguishes those cases is a
        directory of who works here.

        **Request**
        `{"full_name": "…", "employee_code": "SFM-0142", "email": "…",
          "mobile": "+919876543210", "message": "…"}`

        **Responses**
        * `202` — the request was received (whatever happened behind it)
        * `400` — a field is missing or malformed
        * `429` — too many requests from this client
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthInviteRequest'
          multipart/form-data:
            schema:
