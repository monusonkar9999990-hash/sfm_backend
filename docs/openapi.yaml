        * `404` — no such order, or not one this user may see
        * `409` — a submitted order cannot be deleted
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: |-
        Cancels the order, with a reason.

        A draft may be cancelled by whoever raised it. A submitted order needs
        `cancel_orders` — by then it is a commitment, not a note to self.

        **Responses**
        * `200` — the cancelled order
        * `400` — no reason given, or already cancelled or completed
        * `401` — missing or invalid access token
        * `403` — a submitted order, and the caller is not a manager
        * `404` — no such order
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelOrder'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrder'
          description: ''
  /api/v1/orders/{id}/submit/:
    post:
      operationId: orders_submit_create
      description: |-
        Books the order.

        Totals are recomputed on the way through rather than trusted from the
        draft: a product's rate may have moved since the draft was saved, and the
        figure that matters is the one at the moment of booking.

        **Responses**
        * `200` — the submitted order
        * `400` — empty, or not in a state that can be submitted, including one
          that has been submitted already
        * `401` — missing or invalid access token
        * `403` — not this user's order
        * `404` — no such order
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/privacy/:
    get:
      operationId: privacy_retrieve
      description: |-
        The privacy policy in force.

        **Responses**
        * `200` — the current version
        * `404` — nothing published yet
      summary: The privacy policy in force
      tags:
      - privacy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/products/:
    get:
      operationId: products_list
      description: |-
        The catalogue, and the way to add to it.

        **Query**
        * `search` — matches the name, product code or brand
        * `category` — one of cement, steel, paint, adhesive, tiles, plumbing,
          electrical, other
        * `active` — `true` or `false`; omitted, both are returned
        * `ordering` — `name`, `price` (or `selling_price`), `mrp`, `created_at`,
          each with a `-` prefix for descending
        * `page`, `page_size` — page size caps at 100

        **Responses**
        * `200` — a paginated list
        * `201` — the product, in the shape a list entry has
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow editing the catalogue
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - products
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: |-
        The catalogue, and the way to add to it.

        **Query**
        * `search` — matches the name, product code or brand
        * `category` — one of cement, steel, paint, adhesive, tiles, plumbing,
          electrical, other
        * `active` — `true` or `false`; omitted, both are returned
        * `ordering` — `name`, `price` (or `selling_price`), `mrp`, `created_at`,
          each with a `-` prefix for descending
        * `page`, `page_size` — page size caps at 100

        **Responses**
        * `200` — a paginated list
        * `201` — the product, in the shape a list entry has
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow editing the catalogue
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWrite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: products_retrieve
      description: |-
        One product: read it, change it, or withdraw it.

        **DELETE is a withdrawal, not an erasure.** The row is marked inactive and
        disappears from `?active=true`, but it is still there — an order raised
        last month names this product, and deleting the row would either cascade
        into that order's history or fail against its foreign key. Both are worse
        than a flag. The response is still `204 No Content`.

        **Responses**
        * `200` — the product (GET, PUT, PATCH)
        * `204` — withdrawn
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow editing the catalogue
        * `404` — no such product
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      description: |-
        One product: read it, change it, or withdraw it.

        **DELETE is a withdrawal, not an erasure.** The row is marked inactive and
        disappears from `?active=true`, but it is still there — an order raised
        last month names this product, and deleting the row would either cascade
        into that order's history or fail against its foreign key. Both are worse
        than a flag. The response is still `204 No Content`.

