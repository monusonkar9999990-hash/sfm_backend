        last month names this product, and deleting the row would either cascade
        into that order's history or fail against its foreign key. Both are worse
        than a flag. The response is still `204 No Content`.

        **Responses**
        * `200` — the product (GET, PUT, PATCH)
        * `204` — withdrawn
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow editing the catalogue
        * `404` — no such product
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
    delete:
      operationId: products_destroy
      description: |-
        One product: read it, change it, or withdraw it.

        **DELETE is a withdrawal, not an erasure.** The row is marked inactive and
        disappears from `?active=true`, but it is still there — an order raised
        last month names this product, and deleting the row would either cascade
        into that order's history or fail against its foreign key. Both are worse
        than a flag. The response is still `204 No Content`.

        **Responses**
        * `200` — the product (GET, PUT, PATCH)
        * `204` — withdrawn
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow editing the catalogue
        * `404` — no such product
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/reports/attendance/:
    get:
      operationId: reports_attendance_retrieve
      description: |-
        Attendance across a window.

        **Query** `date_from`, `date_to`, `employee` (or `employee_id`)

        `absent` is measured against calendar days — this system has no holiday
        calendar — so `days_in_range` and `expected_records` are returned beside
        it rather than leaving the basis implied.

        **Responses**
        * `200` — the report
        * `400` — a malformed or backwards date range
        * `401` / `403` — as above
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReport'
          description: ''
  /api/v1/reports/beats/:
    get:
      operationId: reports_beats_retrieve
      description: |-
        Beat coverage across a window.

        `skipped` counts skipped **stops**; a plan has no skipped state, so
        `missed` is the plan-level figure beside it.

        **Query** `date_from`, `date_to`

        **Responses** `200` · `400` · `401` · `403`
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeatReport'
          description: ''
  /api/v1/reports/customers/:
    get:
      operationId: reports_customers_retrieve
      description: |-
        The customer book, and what the window added to it.

        **Query** `date_from`, `date_to` — these bound `new_customers` only; the
        totals are counts of the book as it stands.

        **Responses** `200` · `400` · `401` · `403`
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReport'
          description: ''
  /api/v1/reports/products/:
    get:
      operationId: reports_products_retrieve
      description: |-
        Catalogue health.

        Takes no date range: a stock level is a fact about now, not about a
        window, and a `?date_from=` that quietly did nothing would be worse than
        not offering one.

        **Responses** `200` · `401` · `403`
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReport'
          description: ''
  /api/v1/reports/sales/:
    get:
      operationId: reports_sales_retrieve
      description: |-
        Money booked in a window, and who and what it came from.

        **Query** `date_from`, `date_to` (default: the last 30 days),
        `employee_id`, `customer_id`, `limit` (top-N size, 1–50, default 5)

        Cancelled orders are counted but excluded from every money figure — an
        order that was called off is not revenue.

        `employee_id` is only meaningful to a caller whose scope covers other
        people; for anyone else the queryset is already their own.

        **Responses**
        * `200` — the report
        * `400` — a malformed or backwards date range
        * `401` — missing or invalid access token
        * `403` — the role does not include reports
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
          description: ''
  /api/v1/reports/site-visits/:
    get:
      operationId: reports_site_visits_retrieve
      description: |-
        Site visits across a window.

        `planned` counts visits **recorded** — a visit is created on arrival, so
        nothing is ever in a planned state. It is not a plan-versus-actual figure.

        **Query** `date_from`, `date_to`

        **Responses** `200` · `400` · `401` · `403`
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisitReport'
          description: ''
  /api/v1/site-visits/:
    get:
      operationId: site_visits_list
      description: |-
        The signed-in user's own visits, newest first.

        Scoped by the queryset rather than by a parameter the client sends, so
        there is nothing to tamper with.

        **Query** `status` (`in_progress`, `completed`, `cancelled`),
        `follow_up_due=true` for the visits whose follow-up date has arrived.

        **Responses**
        * `200` — a paginated list
        * `401` — missing or invalid access token
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - site-visits
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSiteVisitList'
          description: ''
  /api/v1/site-visits/{id}/:
    get:
      operationId: site_visits_retrieve
      description: |-
        One visit, with its photos.

        **Responses**
        * `200` — the visit
        * `403` — it belongs to another user
        * `404` — no such visit
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - site-visits
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
  /api/v1/site-visits/{id}/cancel/:
    post:
      operationId: site_visits_cancel_create
      description: |-
        Abandon an open visit, with a reason.

        Cancelled rather than deleted: a visit that was started and then vanished
        is a hole in the record.

        **Responses**
        * `200` — the cancelled visit
        * `400` — no reason given
        * `409` — the visit is already closed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - site-visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelVisit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelVisit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelVisit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelVisit'
          description: ''
  /api/v1/site-visits/{id}/check-out/:
    post:
      operationId: site_visits_check_out_create
      description: |-
        Leave the site, and record what the visit found.

        `duration_minutes` is computed from the two server-held stamps.

        **Responses**
        * `200` — the closed visit
        * `400` — bad GPS fix, or a check-out before the check-in
        * `403` — the role lacks `log_site_visits`, or it is another user's visit
        * `404` — no such visit
        * `409` — the visit is already closed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - site-visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckOut'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckOut'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckOut'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisitCheckOut'
          description: ''
  /api/v1/site-visits/{id}/images/:
    post:
      operationId: site_visits_images_create
      description: |-
        Attach a photo to an open visit.

        Photos are only accepted while the visit is open — a picture added after
        the fact is not evidence of what was there at the time.

        **Request** `multipart/form-data`: `image`, `tag`, `caption`, `latitude`,
        `longitude`, `captured_at`

        **Responses**
        * `201` — the visit, with the new photo on it
        * `400` — not an image, or a field is malformed
        * `403` — the role lacks `log_site_visits`, or it is another user's visit
        * `409` — the visit is closed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - site-visits
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddImage'
          application/json:
            schema:
              $ref: '#/components/schemas/AddImage'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddImage'
          description: ''
  /api/v1/site-visits/{id}/images/{image_pk}/:
    delete:
      operationId: site_visits_images_destroy
      description: |-
        Remove a photo from an open visit.

        **Responses**
        * `200` — the visit, without it
        * `403` — another user's visit
        * `404` — no such visit or photo
        * `409` — the visit is closed
      summary: Remove a visit photo
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: image_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - site-visits
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/site-visits/check-in/:
    post:
      operationId: site_visits_check_in_create
      description: |-
        Arrive at a site.

        Only one visit may be open at a time — two at once would make every
        duration a guess. The distance from where the site is plotted is recorded
        but never used to refuse the visit: a site's pin is often approximate
        while the person is standing on it.

        **Request** `{"site": "<uuid>", "purpose": "follow_up", "latitude": …,
        "longitude": …, "accuracy": …, "address": "…", "captured_at": "…",
        "sync_id": "<uuid>"}`

        **Responses**
        * `201` — the open visit
        * `200` — this `sync_id` was already recorded; the original is returned
        * `400` — bad GPS fix, stale timestamp, or an inactive site
        * `401` — missing or invalid access token
        * `403` — the role lacks `log_site_visits`
        * `409` — a visit is already open
      tags:
      - site-visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitCheckIn'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisitCheckIn'
          description: ''
  /api/v1/site-visits/open/:
    get:
      operationId: site_visits_open_retrieve
      description: |-
        The visit the user is in the middle of, or `null`.

        The client asks this on launch to decide whether to offer a check-in or a
        check-out.

        **Responses**
        * `200` — `{"visit": {...}}` or `{"visit": null}`
        * `401` — missing or invalid access token
      summary: The visit currently in progress
      tags:
      - site-visits
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/site-visits/sites/:
    get:
      operationId: site_visits_sites_list
      description: |-
        The project sites available to call on, and the way to register one.

        **Query** `search` matches the site name, its code or the customer.
        `customer_id` narrows the list to one customer's sites.

        Reads stay open to any signed-in user — a site is somewhere to visit, not
        a private record. Registering one needs `onboard_customers`, the same
        permission that gates adding the customer it belongs to.

        **Responses**
        * `200` — a paginated list
        * `201` — the site, in the same shape a list entry has
        * `400` — a field failed validation, keyed by field name
        * `401` — missing or invalid access token
        * `403` — the role does not allow onboarding
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - site-visits
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
